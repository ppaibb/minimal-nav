services:
  minimal-nav:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minimal-nav
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/nav.db
      - ADMIN_PASSWORD=admin123
    volumes:
      - ./data:/app/data

version: '3.8'

services:
  # ==============================
  # Go 后端服务
  # ==============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minimal-nav-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - DB_PATH=/app/data/nav.db
      - GIN_MODE=release
    volumes:
      # 持久化存储 SQLite 数据库文件
      - backend-data:/app/data
    networks:
      - nav-network
    # 也可以开放宿主机 8080 端口用于调试，生产中通过 Nginx 走 80 端口
    expose:
      - "8080"

  # ==============================
  # Nginx 前端与反向代理服务
  # ==============================
  frontend:
    image: nginx:alpine
    container_name: minimal-nav-frontend
    restart: unless-stopped
    ports:
      # 映射宿主机 80 端口
      - "80:80"
    volumes:
      # 挂载 Nginx 配置文件
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 挂载前端 build 打包产物目录
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - nav-network

# 容器间互通网络
networks:
  nav-network:
    driver: bridge

# 数据卷持久化
volumes:
  backend-data:
